<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لفريال، بكل حب ♡</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:linear-gradient(135deg,#ffd6e7,#fff0f6,#ffe0ed);
  color:#5b2340;
}
.wrap{
  max-width:900px;
  margin:auto;
  padding:25px;
}
.card{
  background:rgba(255,255,255,.8);
  border-radius:25px;
  padding:30px;
  margin:20px 0;
  box-shadow:0 10px 30px rgba(150,50,100,.12);
}
h1,h2{
  text-align:center;
}
.hero{
  text-align:center;
  padding:60px 20px;
}
.hero h1{
  font-size:42px;
}
.hero p{
  font-size:18px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}
.memory{
  background:#fff;
  padding:20px;
  border-radius:18px;
  text-align:center;
}
.chatbox{
  margin-top:25px;
}
.status{
  background:#fff1f7;
  padding:12px;
  border-radius:12px;
  margin-bottom:15px;
  text-align:center;
}
.roomrow,.composer{
  display:flex;
  gap:8px;
  margin:10px 0;
}
input{
  flex:1;
  border:2px solid #f3bfd3;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  outline:none;
}
.btn{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  background:#e95b91;
  color:white;
  cursor:pointer;
  font-weight:bold;
}
.btn:hover{
  opacity:.9;
}
.secondary{
  background:#9e6680;
}
.chatlog{
  height:320px;
  overflow-y:auto;
  background:#fff;
  border-radius:18px;
  padding:15px;
  border:1px solid #f2c8d8;
}
.msg{
  background:#ffe3ef;
  padding:10px 14px;
  border-radius:15px;
  margin:8px 0;
  width:fit-content;
  max-width:80%;
}
.mine{
  margin-right:auto;
  background:#f7c2d8;
}
.small{
  color:#927080;
  text-align:center;
  font-size:13px;
}
footer{
  text-align:center;
  padding:30px;
}
@media(max-width:600px){
  .roomrow,.composer{
    flex-direction:column;
  }
  .hero h1{
    font-size:32px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<section class="card hero">
  <h1>إلى فريال 🌷</h1>
  <p>مكان صغير خاص بين شخصين ♡</p>
  <p>شات حقيقي بين شخصين بدون مؤقت.</p>
</section>

<section class="card">
  <h2>ذكرياتنا 🌸</h2>

  <div class="grid">
    <div class="memory">🌷<br>ذكرى جميلة</div>
    <div class="memory">💗<br>لحظة مميزة</div>
    <div class="memory">✨<br>شيء لن ننساه</div>
  </div>
</section>

<section class="card chatbox">

  <h2>شاتنا 💗</h2>

  <div class="status" id="status">
    اضغط «إنشاء غرفة» ثم أرسل الكود للطرف الثاني.
  </div>

  <div class="roomrow">
    <button class="btn" id="createBtn">إنشاء غرفة</button>

    <input
      id="room"
      placeholder="كود الغرفة"
      autocomplete="off"
    >

    <button class="btn secondary" id="joinBtn">
      دخول
    </button>
  </div>

  <div class="chatlog" id="chatlog">
    <div class="small">لا يوجد اتصال بعد.</div>
  </div>

  <div class="composer">

    <input
      id="message"
      placeholder="اكتب رسالتك..."
      maxlength="500"
      disabled
    >

    <button
      class="btn"
      id="send"
      disabled
    >
      إرسال
    </button>

  </div>

</section>

<footer>
  ♡ made with love ♡
</footer>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://nagscmkjaluoiyvbnwcn.supabase.co";

/*
  🔴 هنا فقط ضع Publishable Key الخاص بك
*/
const SUPABASE_KEY =
"ضع_المفتاح_الذي_نسخته_من_Supabase_هنا";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let channel = null;
let currentRoom = "";


const statusEl =
document.getElementById("status");

const roomInput =
document.getElementById("room");

const messageInput =
document.getElementById("message");

const sendBtn =
document.getElementById("send");

const createBtn =
document.getElementById("createBtn");

const joinBtn =
document.getElementById("joinBtn");

const chatlog =
document.getElementById("chatlog");


function setStatus(text){
  statusEl.textContent = text;
}


function addMessage(text, mine=false){

  if(chatlog.querySelector(".small")){
    chatlog.innerHTML="";
  }

  const div=document.createElement("div");

  div.className =
    "msg" + (mine ? " mine" : "");

  div.textContent=text;

  chatlog.appendChild(div);

  chatlog.scrollTop =
    chatlog.scrollHeight;
}


function randomRoom(){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code="LOVE-";

  for(let i=0;i<6;i++){
    code +=
      chars[Math.floor(Math.random()*chars.length)];
  }

  return code;
}


async function connectRoom(room){

  if(channel){
    await supabaseClient
      .removeChannel(channel);
  }

  currentRoom=room;

  setStatus("جارٍ الاتصال بالغرفة...");

  channel =
    supabaseClient
      .channel("love-room-" + room);

  channel.on(
    "broadcast",
    {event:"message"},
    ({payload}) => {

      if(payload && payload.text){
        addMessage(
          payload.text,
          false
        );
      }

    }
  );

  const result =
    await channel.subscribe();

  if(result === "SUBSCRIBED"){

    setStatus(
      "تم الاتصال 💗 يمكنكما الكتابة الآن."
    );

    messageInput.disabled=false;
    sendBtn.disabled=false;

    messageInput.focus();

  }else{

    setStatus(
      "فشل الاتصال بالغرفة. تأكد من إعداد Supabase Realtime."
    );

  }

}


createBtn.onclick = async function(){

  const room =
    randomRoom();

  roomInput.value=room;

  await connectRoom(room);

  setStatus(
    "تم إنشاء الغرفة 💗 أرسل هذا الكود للطرف الثاني."
  );

};


joinBtn.onclick = async function(){

  const room =
    roomInput.value.trim();

  if(!room){

    setStatus(
      "اكتب كود الغرفة أولًا."
    );

    return;
  }

  await connectRoom(room);

};


async function sendMessage(){

  const text =
    messageInput.value.trim();

  if(!text || !channel){
    return;
  }

  const result =
    await channel.send({

      type:"broadcast",

      event:"message",

      payload:{
        text:text
      }

    });

  if(result !== "ok"){

    setStatus(
      "تعذر إرسال الرسالة."
    );

    return;
  }

  addMessage(
    text,
    true
  );

  messageInput.value="";

  messageInput.focus();

}


sendBtn.onclick =
sendMessage;


messageInput.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){
      e.preventDefault();
      sendMessage();
    }

  }
);

</script>

</body>
</html>
